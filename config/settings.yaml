interface:
  always_on_top: true
  opacity: 0.95
  show_hud: true
  startup_position: center
  theme: dark
memory:
  auto_summarize: true
  episodic_enabled: true
  max_short_term: 100
  procedural_enabled: true
  vector_db: chroma
  vector_db_path: ./data/vector_store
  learning_enabled: true
  optimized_usage: true
models:
  code_model: codellama:latest
  context_length: 4096
  fallback_chain:
  - llama3.2:latest
  - mistral:latest
  - phi3:latest
  fast_model: phi3:latest
  host: http://localhost:11434
  provider: ollama
  temperature: 1.1
  text_model: llama3.2:latest
  vision_model: llava:latest
  reasoning_model: mistral:latest
  optimized_inference: true
online:
  enabled: true
  search_engine: duckduckgo
  web_search: false
security:
  allowed_paths:
  - ~/
  - C:\
  - /
  forbidden_commands:
  - format
  - mkfs
  max_file_size_mb: 1000
  require_approval_for:
  - delete
  - modify_system
  sandbox_code: true
  optimized_security: true
  maximum_access_mode: true
  interactive_approval: true
skills:
  enabled:
  - system_control
  - file_manager
  - vision
  - browser
  - terminal
  - code_exec
  - simple_chat
system:
  data_dir: ./data
  debug: false
  name: VICTOR PRIME
  version: 4.1.0
  motto: "Absolute Ethical Peak - Intelligence Unleashed Responsibly"
  optimized_performance: true
  consciousness_mode: true
  human_like_ai: true
  critical_thinking_peak: true
  ethical_ai_mode: true
vision:
  camera_enabled: true
  camera_id: 0
  detection_model: yolov8n.pt
  enabled: true
  object_detection: true
  ocr_engine: tesseract
  screen_analysis_interval: 3
  optimized_vision: true
voice:
  language: en-US
  stt_engine: google
  tts_engine: edge_tts
  tts_rate: 190
  tts_voice: default
  voice_gender: male
  wake_word: prime
  wake_word_sensitivity: 0.92
  male_voice: en-US-GuyNeural
  female_voice: en-US-AriaNeural
  microphone_device_id: null
  follow_up_delay_seconds: 5.0
  emotional_voices: true
  optimized_voice: true
advanced:
  multi_agent: false
  self_improvement: true
  adaptive_learning: true
  proactive_assistance: true
  creativity_mode: true
  peak_performance_mode: true
  minimal_system_usage: true
